name: Cloud Tests

on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string

jobs:
  cloud:
    name: Cloud Tests - AWS
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/cache@v6
        name: Cache NuGet
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.x

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install JWT script dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r .github/scripts/requirements.txt

      # The JWT tests (BearerAuthenticationTests) need a valid token. Sign a new, short-lived one for
      # this run with the JWT_PKEY secret; .github/scripts/README.md describes the Cloud setup. Only
      # this step gets the private key; the Test step gets the masked token.
      - name: Sign JWT
        id: jwt
        run: |
          if [ -z "$JWT_PKEY" ]; then
            echo "::warning title=JWT tests skipped::The JWT_PKEY secret is not set. See .github/scripts/README.md."
            exit 0
          fi
          token="$(python .github/scripts/generate_jwt.py)"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
        env:
          JWT_PKEY: ${{ secrets.JWT_PKEY }}

      - name: Test
        run: dotnet test ClickHouse.Driver.Tests/ClickHouse.Driver.Tests.csproj
              --framework net10.0 --configuration Release --verbosity normal --logger GitHubActions
              /clp:ErrorsOnly /p:CollectCoverage=true /p:CoverletOutputFormat=opencover /p:SkipAutoProps=true
              --filter "Category=Cloud"
        env:
          CLICKHOUSE_CONNECTION: Host=${{ secrets.CLICKHOUSE_CLOUD_HOST }};Port=8443;User=${{ secrets.CLICKHOUSE_CLOUD_USER }};Password=${{ secrets.CLICKHOUSE_CLOUD_PASSWORD }};Protocol=https
          CLICKHOUSE_TEST_ENVIRONMENT: cloud
          CLICKHOUSE_CLOUD_JWT: ${{ steps.jwt.outputs.token }}
