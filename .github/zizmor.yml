# Configuration for zizmor, the GitHub Actions static analyzer run by
# .github/workflows/zizmor.yml. Reference: https://docs.zizmor.sh/configuration/
#
# Two things live here: the pinning policy, and the findings accepted by design.
# To see the full picture, including everything ignored below:
#
#   zizmor --no-ignores .

rules:
  # --- Pinning policy -------------------------------------------------------
  # zizmor requires a SHA pin on every action by default. That is relaxed to a
  # tag pin for the namespaces whose release process we already depend on, and
  # kept at SHA for everyone else: an attacker who takes over a third-party
  # repository can move a tag, but cannot change what a SHA points to.
  # Dependabot (.github/dependabot.yml) keeps both forms current.
  unpinned-uses:
    config:
      policies:
        actions/*: ref-pin
        github/*: ref-pin
        ClickHouse/*: ref-pin
        "*": hash-pin

  # --- Accepted by design ---------------------------------------------------
  # These workflows must test against the current server and the current docs
  # builder, so the floating image tag is the point, not an oversight.
  unpinned-images:
    ignore:
      - benchmark.yml
      - benchmark-compare.yml
      - examples.yml
      - docs_verify.yml

  # docs_sync.yml uses pull_request_target with types: [closed], so it runs
  # after a merge and checks out the base ref or a release tag. It never checks
  # out pull request head code, which is the case the audit warns about.
  #
  # tests-cloud-tcp-label.yml uses pull_request_target with types: [labeled], and
  # does check out pull request head code, with the Cloud credentials. That is
  # the point: a maintainer runs the Cloud suite for a fork. The job runs only
  # for the tests:run-cloud label added by a user with write access, checks out
  # the head commit named by the label event, has a read-only token, and skips
  # the cache. A separate job removes the label afterwards.
  dangerous-triggers:
    ignore:
      - docs_sync.yml
      - tests-cloud-tcp-label.yml
