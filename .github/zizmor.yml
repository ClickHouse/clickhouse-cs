# Configuration for zizmor, the GitHub Actions static analyzer run by
# .github/workflows/zizmor.yml. Reference: https://docs.zizmor.sh/configuration/
#
# Two things live here: the pinning policy, and a baseline of the high-severity
# findings that already exist on main. The baseline keeps the CI gate green on
# day one, so the gate only fails on findings a pull request *introduces*.
# To see the full picture, including everything ignored below:
#
#   zizmor --no-ignores .

rules:
  # --- Pinning policy -------------------------------------------------------
  # zizmor requires a SHA pin on every action by default. That is relaxed to a
  # tag pin for the namespaces whose release process we already depend on, and
  # kept at SHA for everyone else: an attacker who takes over a third-party
  # repository can move a tag, but cannot change what a SHA points to.
  # Dependabot (.github/dependabot.yml) keeps both forms current.
  unpinned-uses:
    config:
      policies:
        actions/*: ref-pin
        github/*: ref-pin
        ClickHouse/*: ref-pin
        "*": hash-pin
    # BASELINE, to remove: pin these three third-party actions to a SHA.
    ignore:
      - release.yml:179 # ncipollo/release-action@v1
      - reusable.yml:58 # codecov/codecov-action@v7
      - tests-windows.yml:16 # Vampire/setup-wsl@v6

  # --- Accepted by design ---------------------------------------------------
  # These workflows must test against the current server and the current docs
  # builder, so the floating image tag is the point, not an oversight.
  unpinned-images:
    ignore:
      - benchmark.yml
      - benchmark-compare.yml
      - examples.yml
      - docs_verify.yml

  # docs_sync.yml uses pull_request_target with types: [closed], so it runs
  # after a merge and checks out the base ref or a release tag. It never checks
  # out pull request head code, which is the case the audit warns about.
  dangerous-triggers:
    ignore:
      - docs_sync.yml

  # --- Baseline, to remove --------------------------------------------------
  # Each entry below is a real finding that a follow-up pull request fixes.
  # Delete the entry in the same pull request that fixes the finding.

  # Hoist the interpolation into an env: block, so the value is passed as data
  # instead of being pasted into the shell command.
  template-injection:
    ignore:
      - benchmark-compare.yml:55 # ${{ inputs.pr_number }}
      - release.yml:50 # ${{ inputs.version }}
      - reusable.yml:53 # ${{ inputs.framework }}

  # The app token in docs_sync.yml inherits every permission the installation
  # holds. Add permission-contents: write and permission-pull-requests: write
  # to scope it down to what the docs sync actually does.
  github-app:
    ignore:
      - docs_sync.yml
