# Dedicated ClickHouse for the macro benchmark suite.
#
# Deliberately NOT the shared server on 8123. A benchmark run and somebody else's test suite on the
# same server contend for CPU, and the contention shows up as wall-clock variance that looks like a
# driver regression. ServerCost.CpuWaitRatio is the tell; this container is how you avoid it.
#
#   docker compose -f ClickHouse.Driver.Benchmark.Blog/env/docker-compose.yml up -d
#   ./ClickHouse.Driver.Benchmark.Blog/scripts/stage-datasets.sh
#
# The image tag is pinned, not floating: §8 of the benchmark plan lists the server version as a
# published confounder, and ":latest" would silently re-baseline every number between two runs.
services:
  clickhouse-bench:
    # Pinned. Bump deliberately, and re-run the whole suite when you do — never mid-series.
    image: clickhouse/clickhouse-server:25.10.7.6-alpine
    container_name: clickhouse-bench
    environment:
      # The entrypoint otherwise writes users.d/default-user.xml on boot to disable network access
      # for 'default', which fails against a read-only users.d mount. Skipping user setup keeps the
      # mount read-only and leaves the credentials exactly as server-users.d declares them.
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    ports:
      # 8124/9010 rather than 8123/9000, so this cannot collide with a dev server already running.
      - "8124:8123"
      - "9010:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-bench-data:/var/lib/clickhouse
      # Mount the FILES, not the directories. Mounting a directory onto config.d replaces the
      # image's own contents, which includes docker_related_config.xml — the file that sets
      # listen_host to ::/0.0.0.0. Without it ClickHouse listens on loopback inside the container
      # only: the healthcheck still passes, the published port still accepts a TCP connection, and
      # every request from the host is reset with nothing written to the server log.
      - ./server-config.d/bench.xml:/etc/clickhouse-server/config.d/bench.xml:ro
      - ./server-users.d/bench.xml:/etc/clickhouse-server/users.d/bench.xml:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  clickhouse-bench-data:
